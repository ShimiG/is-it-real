name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Install Chromium for the extension tests
        run: pnpm --filter @isitreal/extension exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Download public eval datasets
        run: pnpm eval:fetch
        continue-on-error: true
      - name: Evaluate
        run: pnpm eval
      - name: Build (spikes and the plugin server bundle)
        run: pnpm build
      - name: Plugin bundle in git matches the source
        run: git diff --exit-code -- plugin/server || (echo "Run 'pnpm build' and commit plugin/server" && exit 1)
