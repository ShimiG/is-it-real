<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Is It Real?</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <h1 id="app-name"></h1>
      <p id="tagline"></p>
    </header>
    <main>
      <button id="check" type="button" class="primary"></button>
      <p id="status" role="status" aria-live="polite"></p>
      <progress id="progress" hidden></progress>
      <div id="results" tabindex="-1"></div>
      <section id="setup" class="card" aria-labelledby="setup-title">
        <h2 id="setup-title" class="section-title"></h2>
        <p id="setup-text" role="status" aria-live="polite"></p>
        <progress id="setup-progress" hidden></progress>
        <button id="setup-button" type="button" hidden></button>
      </section>
    </main>
    <footer>
      <div class="tools">
        <button id="read-aloud" type="button" hidden></button>
        <button id="large-text" type="button" aria-pressed="false"></button>
      </div>
      <p id="version"></p>
    </footer>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
